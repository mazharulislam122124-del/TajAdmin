    window.formatBDT = function(amount) {
      if (amount === undefined || amount === null || isNaN(amount)) return "৳০";
      return "৳" + Number(amount).toLocaleString('bn-BD');
    };

    window.showToast = function(message, type = "success") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const id = "toast_" + Date.now();
      const isSuccess = type === "success";
      const isError = type === "error";

      const toast = document.createElement("div");
      toast.id = id;
      toast.className = `pointer-events-auto flex items-center justify-between p-4 rounded-xl shadow-xl border text-sm font-medium transition-all transform duration-200 ${
        isSuccess ? "bg-slate-900 text-emerald-300 border-emerald-500/40" :
        isError ? "bg-slate-900 text-rose-300 border-rose-500/40" :
        "bg-slate-900 text-sky-300 border-sky-500/40"
      }`;

      toast.innerHTML = `
        <div class="flex items-center gap-3">
          <span>${isSuccess ? "✅" : isError ? "⚠️" : "ℹ️"}</span>
          <span>${message}</span>
        </div>
        <button onclick="document.getElementById('${id}')?.remove()" class="text-slate-400 hover:text-white ml-2">✕</button>
      `;

      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    };

    // Compress Image to Base64 (Ideal for Firestore & Fast Display)
    window.compressImageToBase64 = function(file, maxWidth = 800, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (!ctx) return resolve(event.target.result);

            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(event.target.result);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    // -------------------------------------------------------------
    // 5. AUTHENTICATION LOGIC
    // -------------------------------------------------------------
    function checkExistingSession() {
      try {
        const saved = localStorage.getItem(SESSION_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.authenticated === true) {
            state.isAuthenticated = true;
          }
        }
      } catch (e) {
        localStorage.removeItem(SESSION_KEY);
      }
    }

    window.handleLogin = function(e) {
      e.preventDefault();
      const input = document.getElementById("login-password");
      if (!input) return;
      const pwd = input.value;

      if (pwd === MASTER_PASSWORD) {
        localStorage.setItem(SESSION_KEY, JSON.stringify({ authenticated: true, time: new Date().toISOString() }));
        state.isAuthenticated = true;
        state.loginError = null;
        renderApp();
        initFirestoreListeners();
        showToast("মাস্টার পাসওয়ার্ড যাচাই সফল! স্বাগতম।", "success");
      } else {
        state.loginError = "ভুল মাস্টার পাসওয়ার্ড! অনুগ্রহ করে সঠিক পাসওয়ার্ড দিন।";
        renderApp();
      }
    };

    window.handleLogout = function() {
      localStorage.removeItem(SESSION_KEY);
      state.isAuthenticated = false;
      renderApp();
      showToast("সফলভাবে লগআউট করা হয়েছে।", "info");

    // -------------------------------------------------------------
    // 6. FIRESTORE REAL-TIME SUBSCRIPTIONS
    // -------------------------------------------------------------
    function initFirestoreListeners() {
      if (!state.isAuthenticated) return;

      // Products
      onSnapshot(collection(db, "products"), (snap) => {
        state.products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      }, (e) => console.warn("Products sync", e));

      // Categories
      onSnapshot(collection(db, "categories"), (snap) => {
        state.categories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      }, (e) => console.warn("Categories sync", e));

      // Orders
      onSnapshot(collection(db, "orders"), (snap) => {
        const ords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        ords.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        state.orders = ords;
        renderApp();
      }, (e) => console.warn("Orders sync", e));

      // Coupons
      onSnapshot(collection(db, "coupons"), (snap) => {
        const cps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        cps.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        state.coupons = cps;
        renderApp();
      }, (e) => console.warn("Coupons sync", e));

      // Banners
      onSnapshot(collection(db, "banners"), (snap) => {
        state.banners = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      }, (e) => console.warn("Banners sync", e));

      // Delivery Settings
      onSnapshot(doc(db, "settings", "delivery_settings"), (snap) => {
        if (snap.exists()) {
          state.deliverySettings = { ...DEFAULT_DELIVERY_SETTINGS, ...snap.data() };
          renderApp();
        }
      });

      // Shop Info
      onSnapshot(doc(db, "settings", "shop_info"), (snap) => {
        if (snap.exists()) {
          state.shopInfo = { ...DEFAULT_SHOP_INFO, ...snap.data() };
          renderApp();
        }
      });

      // Site Content
      onSnapshot(doc(db, "settings", "site_content"), (snap) => {
        if (snap.exists()) {
          state.siteContent = { ...DEFAULT_SITE_CONTENT, ...snap.data() };
          renderApp();
        }
      });
    }

    // Save Product

      e.preventDefault();
      const form = e.target;
      const fileInput = form.elements['product-image-file'];
      let imageUrl = form.elements['product-image-url']?.value || "";

      if (fileInput?.files?.[0]) {

      const payload = {
        name: form.elements['product-name'].value.trim(),
        description: form.elements['product-desc'].value.trim(),
        category: form.elements['product-cat'].value,
        price: Number(form.elements['product-price'].value),
        regularPrice: form.elements['product-regular-price'].value ? Number(form.elements['product-regular-price'].value) : null,
        stockStatus: form.elements['product-stock'].value,
        specialDeliveryFee: Number(form.elements['product-special-fee'].value) || 0,
        imageUrl: imageUrl || "https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=600&q=80",
        sku: form.elements['product-sku']?.value.trim() || `TC-${Date.now().toString().slice(-5)}`,
        updatedAt: new Date().toISOString()
      };

      try {
        if (state.selectedItem?.id) {
          await updateDoc(doc(db, "products", state.selectedItem.id), payload);
          showToast("পণ্য সফলভাবে আপডেট করা হয়েছে!", "success");

          await addDoc(collection(db, "products"), { ...payload, createdAt: new Date().toISOString() });
          showToast("নতুন পণ্য সফলভাবে যুক্ত হয়েছে!", "success");

        closeModal();
      } catch (err) {
        showToast("ত্রুটি: " + err.message, "error");
      }
    };

        code,
        discountType: type,
        discountAmount: amount,
        minOrderAmount: minOrder,
        isActive: true,
        updatedAt: new Date().toISOString()

                <button onclick="setTab('orders')" class="px-4 py-2 bg-emerald-900/60 hover:bg-emerald-900 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 border border-white/20 transition">

        case 'delivered':
          return `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">ডেলিভার্ড</span>`;
        case 'cancelled':

        </div>
      `;
    }

    // Banners Tab
    function renderBannersTab() {
      return `
        <div class="space-y-6">
          <div class="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs">
            <div>
              <h3 class="font-bold text-slate-800 text-sm">হোমপেজ ব্যানার ও প্রোমো কন্ট্রোল</h3>
              <p class="text-xs text-slate-500">মোট ব্যানার: ${state.banners.length} টি</p>
            </div>
            <button onclick="openModal('addBanner')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center gap-2 shadow">
              <i data-lucide="plus" class="w-4 h-4"></i> নতুন ব্যানার
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${state.banners.map(b => `
              <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs flex flex-col justify-between">
                <div class="h-40 bg-slate-100 relative">
                  <img src="${b.imageUrl}" class="w-full h-full object-cover" />
                  <span class="absolute top-3 left-3 px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-900/80 text-white backdrop-blur">
                    ${b.badgeText || 'অফার'}
                  </span>
                </div>
                <div class="p-4 flex items-center justify-between">
                  <div>
                    <h4 class="font-bold text-slate-800 text-sm">${b.title}</h4>
                    <p class="text-xs text-slate-500">${b.subtitle || ''}</p>
                  </div>
                  <button onclick="deleteDoc(doc(db, 'banners', '${b.id}')); showToast('ব্যানার মুছে ফেলা হয়েছে');" class="text-rose-600 p-2 hover:bg-rose-50 rounded-lg">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
          ${!state.banners.length ? `<div class="p-12 text-center text-slate-400 text-xs">কোনো ব্যানার নেই। 'নতুন ব্যানার' বাটনে ক্লিক করে হিরো ব্যানার যুক্ত করুন।</div>` : ''}
        </div>
      `;
    }

    // -------------------------------------------------------------
    // 10. MODALS RENDERER
    // -------------------------------------------------------------
    function renderActiveModal() {
      if (!state.activeModal) return '';

      // Product Modal (Add / Edit)
      if (state.activeModal === 'addProduct' || state.activeModal === 'editProduct') {
        const isEdit = state.activeModal === 'editProduct';
        const p = state.selectedItem || {};
        return `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
              <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-slate-900 text-base">${isEdit ? 'পণ্য এডিট করুন' : 'নতুন পণ্য যোগ করুন'}</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">✕</button>
              </div>

              <form onsubmit="handleSaveProduct(event)" class="space-y-4 text-xs">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">পণ্যের নাম *</label>
                  <input name="product-name" required value="${p.name || ''}" placeholder="যেমন: খাঁটি সুন্দরবনের মধু..." class="w-full px-3 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
                </div>

                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">ক্যাটাগরি</label>
                    <select name="product-cat" class="w-full px-3 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 bg-white">
                      ${state.categories.map(c => `
                        <option value="${c.name}" ${p.category === c.name ? 'selected' : ''}>${c.name}</option>
                      `).join('')}
                      <option value="সাধারণ" ${!p.category ? 'selected' : ''}>সাধারণ</option>
                    </select>
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">স্টক স্ট্যাটাস</label>
                    <select name="product-stock" class="w-full px-3 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 bg-white">
                      <option value="in_stock" ${p.stockStatus !== 'out_of_stock' ? 'selected' : ''}>স্টকে আছে (In Stock)</option>
                      <option value="out_of_stock" ${p.stockStatus === 'out_of_stock' ? 'selected' : ''}>স্টক শেষ (Out of Stock)</option>
                    </select>
                  </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">বিক্রয় মূল্য (৳) *</label>
                    <input name="product-price" type="number" required value="${p.price || ''}" placeholder="৳" class="w-full px-3 py-2.5 border rounded-xl font-bold" />
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">পূর্বের মূল্য (৳)</label>
                    <input name="product-regular-price" type="number" value="${p.regularPrice || ''}" placeholder="৳" class="w-full px-3 py-2.5 border rounded-xl" />
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">বিশেষ ডেলিভারি ফি</label>
                    <input name="product-special-fee" type="number" value="${p.specialDeliveryFee || 0}" placeholder="৳" class="w-full px-3 py-2.5 border rounded-xl" />
                  </div>
                </div>

                <!-- Product Image Upload -->
                <div class="p-3 bg-slate-50 rounded-xl border space-y-2">
                  <label class="block font-bold text-slate-700">ডিভাইস / গ্যালারি থেকে ছবি আপলোড</label>
                  <input type="file" name="product-image-file" accept="image/*" class="w-full text-xs" />
                  <input type="text" name="product-image-url" value="${p.imageUrl || ''}" placeholder="অথবা ছবির ওয়েব লিংক..." class="w-full px-3 py-2 border rounded-xl bg-white" />
                </div>

                <div>
                  <label class="block font-bold text-slate-700 mb-1">পণ্যের বিবরণ</label>
                  <textarea name="product-desc" rows="3" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">${p.description || ''}</textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-3 border-t">
                  <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl text-slate-600 font-semibold">বাতিল</button>
                  <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md">
                    ${isEdit ? 'আপডেট করুন' : 'পণ্য যোগ করুন'}
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // Category Modal
      if (state.activeModal === 'addCategory' || state.activeModal === 'editCategory') {
        const isEdit = state.activeModal === 'editCategory';
        const c = state.selectedItem || {};
        return `
          <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
              <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-slate-900 text-sm">${isEdit ? 'ক্যাটাগরি এডিট' : 'নতুন ক্যাটাগরি'}</h3>
                <button onclick="closeModal()">✕</button>
              </div>
              <form onsubmit="handleSaveCategory(event)" class="space-y-4 text-xs">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">ক্যাটাগরির নাম *</label>
                  <input name="cat-name" required value="${c.name || ''}" placeholder="যেমন: ভেষজ ও রূপচর্চা..." class="w-full px-3 py-2 border rounded-xl" />
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">বিবরণ</label>
                  <textarea name="cat-desc" rows="2" class="w-full p-2 border rounded-xl">${c.description || ''}</textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                  <button type="button" onclick="closeModal()" class="px-3 py-1.5 border rounded-xl">বাতিল</button>
                  <button type="submit" class="px-4 py-1.5 bg-emerald-600 text-white font-bold rounded-xl">সেভ করুন</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // Coupon Modal
      if (state.activeModal === 'addCoupon') {
        return `
          <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
              <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-slate-900 text-sm">নতুন প্রোমো কোড তৈরি করুন</h3>
                <button onclick="closeModal()">✕</button>
              </div>
              <form onsubmit="handleSaveCoupon(event)" class="space-y-4 text-xs">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">কুপন কোড (যেমন: TAJ10, EID2026) *</label>
                  <input name="coupon-code" required placeholder="TAJ10" class="w-full px-3 py-2 border rounded-xl uppercase font-mono font-bold" />
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">ডিসকাউন্ট টাইপ</label>
                    <select name="coupon-type" class="w-full px-2 py-2 border rounded-xl bg-white">
                      <option value="percentage">শতাংশ (%)</option>
                      <option value="flat">ফ্ল্যাট টাকা (৳)</option>
                    </select>
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">ছাড়ের পরিমাণ *</label>
                    <input name="coupon-amount" type="number" required placeholder="১০ বা ১০০" class="w-full px-3 py-2 border rounded-xl font-bold" />
                  </div>
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">ন্যূনতম অর্ডার মূল্য (ঐচ্ছিক)</label>
                  <input name="coupon-min-order" type="number" placeholder="৳" class="w-full px-3 py-2 border rounded-xl" />
                </div>
                <div class="flex justify-end gap-2 pt-2">
                  <button type="button" onclick="closeModal()" class="px-3 py-1.5 border rounded-xl">বাতিল</button>
                  <button type="submit" class="px-4 py-1.5 bg-emerald-600 text-white font-bold rounded-xl">কুপন চালু করুন</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // Banner Modal
      if (state.activeModal === 'addBanner') {
        return `
          <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
              <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-slate-900 text-sm">নতুন ব্যানার যোগ করুন</h3>
                <button onclick="closeModal()">✕</button>
              </div>
              <form onsubmit="
                event.preventDefault();
                const form = event.target;
                addDoc(collection(db, 'banners'), {
                  title: form.elements['b-title'].value,
                  subtitle: form.elements['b-sub'].value,
                  badgeText: form.elements['b-badge'].value,
                  imageUrl: form.elements['b-img'].value || 'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=800',
                  createdAt: new Date().toISOString()
                }).then(() => { closeModal(); showToast('ব্যানার যুক্ত হয়েছে'); });
              " class="space-y-3 text-xs">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">ব্যানার শিরোনাম *</label>
                  <input name="b-title" required placeholder="ঈদ স্পেশাল অফার" class="w-full px-3 py-2 border rounded-xl" />
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">সাবটাইটেল</label>
                  <input name="b-sub" placeholder="সকল ভেষজ পণ্যে ২০% ছাড়" class="w-full px-3 py-2 border rounded-xl" />
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">ব্যাজ টেক্সট</label>
                  <input name="b-badge" value="ধামাকা অফার" class="w-full px-3 py-2 border rounded-xl" />
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">ছবির URL</label>
                  <input name="b-img" placeholder="https://..." class="w-full px-3 py-2 border rounded-xl" />
                </div>
                <div class="flex justify-end gap-2 pt-2">
                  <button type="button" onclick="closeModal()" class="px-3 py-1.5 border rounded-xl">বাতিল</button>
                  <button type="submit" class="px-4 py-1.5 bg-emerald-600 text-white font-bold rounded-xl">সেভ করুন</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // Printable Order Invoice Modal
      if (state.activeModal === 'orderInvoice') {
        const ord = state.selectedItem || {};
        return `
          <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div id="invoice-modal-content" class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
              <!-- Invoice Header -->
              <div class="flex items-center justify-between border-b pb-4">
                <div>
                  <h2 class="text-xl font-black text-slate-900">${state.shopInfo.storeName || 'Taj Cares'}</h2>
                  <p class="text-xs text-slate-500">${state.shopInfo.address || 'নারায়ণগঞ্জ, বাংলাদেশ'}</p>
                  <p class="text-xs text-slate-500">ফোন: ${state.shopInfo.phone || '01712-345678'}</p>
                </div>
                <div class="text-right">
                  <span class="px-3 py-1 bg-slate-900 text-white rounded-full text-xs font-mono font-bold">ক্যাশ মেমো</span>
                  <div class="text-xs text-slate-500 mt-2">অর্ডার নং: #${ord.orderNumber || ord.id?.slice(0, 8)}</div>
                  <div class="text-xs text-slate-400">${new Date().toLocaleDateString('bn-BD')}</div>
                </div>
              </div>

              <!-- Customer Details -->
              <div class="bg-slate-50 p-4 rounded-2xl text-xs space-y-1">
                <div class="font-bold text-slate-800">কাস্টমার তথ্য:</div>
                <div><strong>নাম:</strong> ${ord.customerName || 'গ্রাহক'}</div>
                <div><strong>মোবাইল:</strong> ${ord.customerPhone || 'N/A'}</div>
                <div><strong>ডেলিভারি ঠিকানা:</strong> ${ord.address || 'N/A'}</div>
                <div><strong>এরিয়া:</strong> ${ord.deliveryZone === 'narayanganj' ? 'নারায়ণগঞ্জ' : 'নারায়ণগঞ্জের বাইরে'}</div>
              </div>

              <!-- Itemized Table -->
              <table class="w-full text-xs">
                <thead class="border-b text-slate-500 font-bold">
                  <tr>
                    <th class="text-left py-2">আইটেম</th>
                    <th class="text-center py-2">পরিমাণ</th>
                    <th class="text-right py-2">মূল্য</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${(ord.items || []).map(it => `
                    <tr>
                      <td class="py-2.5 font-medium text-slate-800">${it.name}</td>
                      <td class="py-2.5 text-center">${it.quantity}</td>
                      <td class="py-2.5 text-right font-bold">${formatBDT(it.price * it.quantity)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>

              <!-- Total Breakdown -->
              <div class="border-t pt-3 space-y-1 text-xs">
                <div class="flex justify-between text-slate-600">
                  <span>সাবটোটাল</span>
                  <span class="font-bold">${formatBDT(ord.subtotal || 0)}</span>
                </div>
                <div class="flex justify-between text-slate-600">
                  <span>ডেলিভারি চার্জ (${ord.deliveryZone === 'narayanganj' ? 'নারায়ণগঞ্জ' : 'বাইরে'})</span>
                  <span class="font-bold">${formatBDT(ord.deliveryFee || 0)}</span>
                </div>
                <div class="flex justify-between text-base font-black text-slate-900 border-t pt-2 mt-2">
                  <span>সর্বমোট প্রদেয়</span>
                  <span>${formatBDT(ord.totalAmount || 0)}</span>
                </div>
              </div>

              <div class="no-print flex items-center justify-end gap-3 pt-4 border-t">
                <button onclick="closeModal()" class="px-4 py-2 border rounded-xl text-xs font-bold text-slate-600">বন্ধ করুন</button>
                <button onclick="window.print()" class="px-5 py-2 bg-slate-900 hover:bg-black text-white rounded-xl text-xs font-bold flex items-center gap-2 shadow-md">
                  <i data-lucide="printer" class="w-4 h-4"></i> প্রিন্ট ইনভয়েস
                </button>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    // -------------------------------------------------------------
    // 11. INITIALIZATION ON PAGE LOAD
    // -------------------------------------------------------------
    window.addEventListener("DOMContentLoaded", () => {
      checkExistingSession();
      renderApp();
      if (state.isAuthenticated) {
        initFirestoreListeners();
      }
    });

  </script>
</body>
</html>
