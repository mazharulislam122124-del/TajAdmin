    window.showToast = function(message, type = "success") {
      const container = document.getElementById("toast-container");

      const isError = type === "error";

        isError ? "bg-slate-900 text-rose-300 border-rose-500/40" :
        "bg-slate-900 text-sky-300 border-sky-500/40"

        <div class="flex items-center gap-3">

          <span>${message}</span>

      `;

      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    };

    // Compress Image to Base64 (Ideal for Firestore & Fast Display)
    window.compressImageToBase64 = function(file, maxWidth = 800, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (!ctx) return resolve(event.target.result);

            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(event.target.result);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    // Normalize Image URL helper (auto-prefix protocol if missing)
    window.normalizeImageUrl = function(raw) {
      if (!raw) return "";
      let url = String(raw).trim();
      if (!url) return "";
      if (!url.startsWith("http://") && !url.startsWith("https://") && !url.startsWith("data:") && !url.startsWith("blob:")) {
        url = "https://" + url;
      }
      return url;
    };

    // Robust Firestore Date Parser
    window.parseFirestoreDate = function(val) {
      if (!val) return new Date().toISOString();
      if (typeof val?.toDate === 'function') {
        try {
          const d = val.toDate();
          if (!isNaN(d.getTime())) return d.toISOString();
        } catch {}
      }
      if (typeof val === 'object' && typeof val.seconds === 'number') {
        const d = new Date(val.seconds * 1000 + (val.nanoseconds ? Math.round(val.nanoseconds / 1000000) : 0));
        if (!isNaN(d.getTime())) return d.toISOString();
      }
      if (val instanceof Date) {
        if (!isNaN(val.getTime())) return val.toISOString();
      }
      if (typeof val === 'number') {
        const d = val < 10000000000 ? new Date(val * 1000) : new Date(val);
        if (!isNaN(d.getTime())) return d.toISOString();
      }
      if (typeof val === 'string') {
        const trimmed = val.trim();
        if (/^\d+$/.test(trimmed)) {
          const num = Number(trimmed);
          const d = num < 10000000000 ? new Date(num * 1000) : new Date(num);
          if (!isNaN(d.getTime())) return d.toISOString();
        }
        const d = new Date(trimmed);
        if (!isNaN(d.getTime())) return d.toISOString();
      }
      return new Date().toISOString();
    };

    // Format Date into Bengali string safely
    window.formatOrderDate = function(val) {
      try {
        const iso = window.parseFirestoreDate(val);
        const d = new Date(iso);
        if (isNaN(d.getTime())) return 'সম্প্রতি';
        return d.toLocaleDateString('bn-BD', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch {
        return 'সম্প্রতি';
      }
    };

      if (!raw || typeof raw !== 'object') {
        return {
          id: docId || 'unknown',

          paymentMethod: 'cod',
          paymentStatus: 'unpaid',
          orderStatus: 'Pending',
          createdAt: new Date().toISOString()

      const id = String(docId || raw.id || raw.orderId || raw.orderNumber || raw.orderCode || 'TC-' + Date.now().toString().slice(-6));
      const orderNumber = String(raw.orderNumber || raw.orderCode || raw.orderId || (raw.id ? (raw.id.startsWith('#') ? raw.id : '#' + raw.id.slice(0, 8)) : '#' + id.slice(0, 8)));

      const customerName = String(

        raw.customer?.name ||
        raw.name ||
        raw.shippingAddress?.name ||
        raw.deliveryAddress?.name ||
        raw.user?.name ||
        raw.userName ||

      const customerPhone = String(
        raw.customerPhone ||
        raw.customer?.phone ||
        raw.phone ||
        raw.mobile ||
        raw.phoneNumber ||
        raw.contactNumber ||
        raw.shippingAddress?.phone ||
        raw.deliveryAddress?.phone ||
        raw.user?.phone ||
        'ফোন নম্বর নেই'
      ).trim();

      const customerAddress = String(
        raw.customerAddress ||
        raw.customer?.address ||
        raw.address ||
        raw.shippingAddress?.address ||
        raw.shippingAddress?.fullAddress ||
        raw.deliveryAddress?.address ||
        raw.deliveryAddress ||
        raw.fullAddress ||
        'ঠিকানা উল্লেখ নেই'
      ).trim();

      const rawDistrict = String(
        raw.customerDistrict ||
        raw.district ||
        raw.customer?.district ||
        raw.shippingAddress?.district ||
        raw.city ||
        raw.shippingAddress?.city ||
        ''
      ).trim();

      const isNarayanganj =
        raw.deliveryZone === 'narayanganj' ||
        /নারায়ণগঞ্জ|narayanganj|chashara|চাষাড়া|সিদ্ধিরগঞ্জ|siddhirganj/i.test(rawDistrict) ||
        /নারায়ণগঞ্জ|narayanganj/i.test(customerAddress);

      const customerDistrict = rawDistrict || (isNarayanganj ? 'নারায়ণগঞ্জ' : 'অন্যান্য জেলা');
      const deliveryZone = raw.deliveryZone || (isNarayanganj ? 'narayanganj' : 'outside_narayanganj');

      const rawItems = 
        raw.items ||
        raw.products ||
        raw.cartItems ||
        raw.cart ||
        raw.orderItems ||
        raw.lineItems ||
        [];

      const items = Array.isArray(rawItems)
        ? rawItems.map((it, idx) => ({
            productId: it.productId || it.id || it.product?.id,
            productName: String(it.productName || it.name || it.title || it.productTitle || it.product?.name || `পণ্য #${idx + 1}`).trim(),
            quantity: Number(it.quantity || it.qty || it.count || 1) || 1,
            unitPrice: Number(it.unitPrice || it.price || it.productPrice || it.amount || 0) || 0,
            specialFee: Number(it.specialFee || it.specialDeliveryFee || 0) || 0,
            imageUrl: it.imageUrl || it.image || it.product?.imageUrl || it.product?.image
          }))
        : [];

      const deliveryFee = Number(raw.deliveryFee ?? raw.shippingFee ?? raw.deliveryCharge ?? (isNarayanganj ? 60 : 120)) || 0;

      let subtotal = Number(raw.subtotal ?? raw.subTotal ?? raw.itemsTotal);
      if (isNaN(subtotal) || subtotal <= 0) {
        subtotal = items.reduce((acc, it) => acc + (it.unitPrice * it.quantity), 0);
      }

      let totalAmount = Number(raw.totalAmount ?? raw.total ?? raw.grandTotal ?? raw.totalPrice);
      if (isNaN(totalAmount) || totalAmount <= 0) {
        totalAmount = subtotal + deliveryFee;
      }

      const rawStatus = String(raw.orderStatus || raw.status || 'Pending').trim().toLowerCase();
      let orderStatus = 'Pending';
      if (rawStatus === 'processing' || rawStatus === 'প্রসেসিং') orderStatus = 'Processing';
      else if (rawStatus === 'delivered' || rawStatus === 'ডেলিভার্ড' || rawStatus === 'completed') orderStatus = 'Delivered';
      else if (rawStatus === 'cancelled' || rawStatus === 'বাতিল') orderStatus = 'Cancelled';
      else orderStatus = 'Pending';

      const paymentMethod = String(raw.paymentMethod || raw.payment?.method || 'cod').toLowerCase();
      const rawPaymentStatus = String(raw.paymentStatus || raw.payment?.status || 'unpaid').toLowerCase();
      const paymentStatus = (rawPaymentStatus === 'paid' || rawPaymentStatus === 'পরিশোধিত') ? 'paid' : 'unpaid';

      const createdAt = window.parseFirestoreDate(raw.createdAt || raw.orderDate || raw.date || raw.timestamp || raw.created_at);

      return {
        ...raw,
        id,
        orderNumber,
        customerName,
        customerPhone,
        customerAddress,
        customerDistrict,
        deliveryZone,
        items,
        subtotal,
        deliveryFee,
        totalAmount,
        paymentMethod,
        paymentStatus,
        orderStatus,
        orderNote: raw.orderNote || raw.note || raw.customerNote || raw.instructions || '',
        createdAt
      };
    };

    function checkExistingSession() {
      try {
        const saved = localStorage.getItem(SESSION_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.authenticated === true) {
            state.isAuthenticated = true;
          }
        }
      } catch (e) {
        localStorage.removeItem(SESSION_KEY);
      }
    }

    window.handleLogin = function(e) {
      e.preventDefault();
      const input = document.getElementById("login-password");
      if (!input) return;
      const pwd = input.value;

      if (pwd === MASTER_PASSWORD) {
        localStorage.setItem(SESSION_KEY, JSON.stringify({ authenticated: true, time: new Date().toISOString() }));
        state.isAuthenticated = true;
        state.loginError = null;
        renderApp();
        initFirestoreListeners();
        showToast("মাস্টার পাসওয়ার্ড যাচাই সফল! স্বাগতম।", "success");
      } else {
        state.loginError = "ভুল মাস্টার পাসওয়ার্ড! অনুগ্রহ করে সঠিক পাসওয়ার্ড দিন।";
        renderApp();
      }
    };

    window.handleLogout = function() {
      localStorage.removeItem(SESSION_KEY);

    // -------------------------------------------------------------
    // 6. FIRESTORE REAL-TIME SUBSCRIPTIONS
    // -------------------------------------------------------------
    function initFirestoreListeners() {
      if (!state.isAuthenticated) return;

      // Products
      onSnapshot(collection(db, "products"), (snap) => {
        state.products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      }, (e) => console.warn("Products sync", e));

      // Categories
      onSnapshot(collection(db, "categories"), (snap) => {
        state.categories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      }, (e) => console.warn("Categories sync", e));

      // Orders
      onSnapshot(collection(db, "orders"), (snap) => {
        const ords = snap.docs.map(d => window.normalizeOrder(d.data(), d.id));
        ords.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        state.orders = ords;
        renderApp();
      }, (e) => console.warn("Orders sync", e));

      // Coupons
      onSnapshot(collection(db, "coupons"), (snap) => {
        const cps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        cps.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        state.coupons = cps;
        renderApp();
      }, (e) => console.warn("Coupons sync", e));

      // Banners
      onSnapshot(collection(db, "banners"), (snap) => {
        state.banners = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      }, (e) => console.warn("Banners sync", e));

      // Delivery Settings
      onSnapshot(doc(db, "settings", "delivery_settings"), (snap) => {
        if (snap.exists()) {
          state.deliverySettings = { ...DEFAULT_DELIVERY_SETTINGS, ...snap.data() };
          renderApp();
        }
      });

      // Shop Info
      onSnapshot(doc(db, "settings", "shop_info"), (snap) => {
        if (snap.exists()) {
          state.shopInfo = { ...DEFAULT_SHOP_INFO, ...snap.data() };
          renderApp();
        }
      });

      // Site Content
      onSnapshot(doc(db, "settings", "site_content"), (snap) => {
        if (snap.exists()) {
          state.siteContent = { ...DEFAULT_SITE_CONTENT, ...snap.data() };
          renderApp();
        }
      });
    }

      const fileInput = form.elements['product-image-file'];
      const rawTextUrl = form.elements['product-image-url']?.value || "";
      let imageUrl = window.normalizeImageUrl(rawTextUrl);

      // If a local image file was chosen from device/gallery, compress & encode to Base64

      const isActive = state.currentTab === tabKey;
      return `

            : 'text-slate-300 hover:bg-slate-800 hover:text-white'

          <div class="flex items-center gap-3">
            <i data-lucide="${iconName}" class="w-5 h-5 ${isActive ? 'text-white' : 'text-slate-400'}"></i>
            <span>${label}</span>
          </div>
          ${badge ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 font-bold">${badge}</span>` : ''}
        </button>
      `;

      switch(tab) {
        case 'overview': return 'ড্যাশবোর্ড ওভারভিউ (Taj Cares)';
        case 'products': return 'প্রোডাক্ট ও ইনভেন্টরি ম্যানেজমেন্ট';
        case 'categories': return 'ডায়নামিক ক্যাটাগরি ম্যানেজমেন্ট';
        case 'orders': return 'অর্ডার ট্র্যাকিং ও ডেলিভারি';
        case 'coupons': return 'প্রোমো কোড ও কুপন ম্যানেজমেন্ট';
        case 'banners': return 'অফার ও ব্যানার কন্ট্রোল';
        case 'delivery': return 'ডেলিভারি ফি সেটিংস (Narayanganj & Outside)';
        case 'shop': return 'শপ সেটিংস ও সাইট কনটেন্ট কন্ট্রোল';
        default: return 'অ্যাডমিন ড্যাশবোর্ড';
      }
    }

    // -------------------------------------------------------------
    // 9. TAB CONTENT GENERATORS
    // -------------------------------------------------------------
    function renderTabContent(tab) {
      switch(tab) {
        case 'overview': return renderOverviewTab();
        case 'products': return renderProductsTab();
        case 'categories': return renderCategoriesTab();
        case 'orders': return renderOrdersTab();
        case 'coupons': return renderCouponsTab();
        case 'banners': return renderBannersTab();
        case 'delivery': return renderDeliveryTab();
        case 'shop': return renderShopTab();
        default: return '';
      }
    }

    // --- OVERVIEW TAB ---
    function renderOverviewTab() {
      const totalSales = state.orders.reduce((sum, o) => o.orderStatus === 'Delivered' || o.paymentStatus === 'paid' ? sum + (o.totalAmount || 0) : sum, 0);
      const pendingCount = state.orders.filter(o => o.orderStatus === 'Pending').length;

      return `
        <div class="space-y-6">

              </button>
              <button onclick="setTab('orders')" class="px-4 py-2.5 rounded-xl bg-emerald-700 text-white font-semibold text-xs border border-emerald-600 cursor-pointer hover:bg-emerald-600">
                সকল অর্ডার দেখুন →
              </button>
            </div>
          </div>

          <!-- 4 Metrics Grid -->

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <span class="text-xs text-slate-500 font-medium">মোট বিক্রয় (সংগৃহীত)</span>
              <div class="text-2xl font-bold text-slate-900 mt-1">${formatBDT(totalSales)}</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">

              <div class="text-2xl font-bold text-amber-600 mt-1">${pendingCount} টি</div>
            </div>
            <div onclick="setTab('products')" class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs cursor-pointer">
              <span class="text-xs text-slate-500 font-medium">মোট পণ্য সংখ্যা</span>
              <div class="text-2xl font-bold text-slate-900 mt-1">${state.products.length} টি</div>

          </div>

                    </span>
                    ${p.specialDeliveryFee > 0 ? `
                      <span class="absolute bottom-2.5 left-2.5 text-[9px] font-bold px-2 py-0.5 rounded bg-amber-500 text-slate-950">

                    <span class="text-[10px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">${p.category}</span>
                    <h3 class="font-bold text-slate-900 text-sm mt-1.5 line-clamp-2">${p.name}</h3>

                    এডিট
                  </button>
                  <button onclick="handleDeleteProduct('${p.id}')" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg cursor-pointer">

              </div>
            `).join('') || `<div class="col-span-full p-12 text-center text-slate-400">কোন পণ্য পাওয়া যায়নি।</div>`}

                        <td class="py-2 text-center font-mono">${it.quantity || 1}</td>
                        <td class="py-2 text-right font-mono">${formatBDT(it.unitPrice || it.price || 0)}</td>
                        <td class="py-2 text-right font-mono font-bold">${formatBDT((it.unitPrice || it.price || 0) * (it.quantity || 1) + (it.specialFee || 0))}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>

                <div class="border-t border-slate-200 pt-3 space-y-1 text-xs">
                  <div class="flex justify-between text-slate-600"><span>সাবটোটাল:</span><span class="font-mono">${formatBDT(o.subtotal)}</span></div>
                  <div class="flex justify-between text-slate-600"><span>ডেলিভারি ফি (${o.deliveryZone === 'narayanganj' || o.customerDistrict === 'নারায়ণগঞ্জ' ? 'নারায়ণগঞ্জ' : 'নারায়ণগঞ্জের বাইরে'}):</span><span class="font-mono">${formatBDT(o.deliveryFee)}</span></div>
                  <div class="flex justify-between text-sm font-bold text-slate-900 border-t pt-2"><span>সর্বমোট প্রদেয়:</span><span class="text-emerald-700 font-mono">${formatBDT(o.totalAmount)}</span></div>
                </div>

                <div class="text-center pt-3 text-[11px] text-slate-500 border-t border-dashed border-slate-200">
                  ${state.shopInfo.storeName || 'তাজ কেয়ার্স'} এ কেনাকাটা করার জন্য ধন্যবাদ! প্রয়োজনে হেল্পলাইন: ${state.shopInfo.phone || state.shopInfo.whatsapp || '01712-345678'}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    // -------------------------------------------------------------
    // 11. INITIALIZATION ON PAGE LOAD
    // -------------------------------------------------------------
    checkExistingSession();
    renderApp();
    if (state.isAuthenticated) {
      initFirestoreListeners();
    }
  </script>
</body>
</html>
