<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Cares - Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: { 50: '#ecfdf5', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' }
                    }
                }
            }
        }
    </script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="menu-btn" class="p-2 text-slate-600 hover:text-emerald-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <h1 class="text-lg font-bold text-slate-800">ড্যাশবোর্ড ওভারভিউ (Taj Cares)</h1>
            </div>
            <div class="text-sm font-medium bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg border border-emerald-200">
                এডমিন প্যানেল
            </div>
        </div>
    </header>

    <!-- Sidebar / Mobile Menu Drawer -->
    <div id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-xl transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 border-b border-slate-200 flex items-center justify-between">
            <h2 class="font-bold text-emerald-800 text-lg">Taj Cares Admin</h2>
            <button id="close-btn" class="p-2 text-slate-500 hover:text-red-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <nav class="p-4 space-y-2 flex-1">
            <a href="#" class="block px-4 py-2.5 rounded-lg bg-emerald-50 text-emerald-700 font-medium">ওভারভিউ</a>
            <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">পণ্য ব্যবস্থাপনা</a>
            <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">সকল অর্ডার</a>
            <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">কুপন কোড</a>
            <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">সাইট সেটিংস</a>
        </nav>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/40 z-40 hidden"></div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-xs text-slate-500">মোট বিক্রয়</p>
                <h3 class="text-xl font-bold text-slate-800 mt-1">৳ ২,৩৫৫</h3>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-xs text-slate-500">সর্বমোট অর্ডার</p>
                <h3 class="text-xl font-bold text-slate-800 mt-1">৩ টি</h3>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
            <h3 class="font-bold text-slate-800 text-lg mb-2">এডমিন কন্ট্রোল প্যানেল সচল রয়েছে</h3>
            <p class="text-sm text-slate-600">বাম পাশের থ্রি-ড্যাশ (☰) মেনু থেকে যেকোনো সেকশনে প্রবেশ করতে পারবেন।</p>
        </div>
    </main>

    <!-- Script to handle sidebar toggle -->
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
